<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Jump & Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Das Zwergenspiel</h1>
<div id="gameWrapper">
  <canvas id="canvas" width="800" height="400"></canvas>
  
  <div id="startScreen">
    <button id="startButton">
      berühre den Bildschirm oder drücke einen beliebigen Knopf
    </button>
  </div>

  <!-- Touch-Steuerung -->
  <div id="touchControls">
    <div id="moveButtons">
      <button id="leftBtn">L</button>
      <button id="rightBtn">R</button>
      <button id="jumpBtn">JUMP</button>
    </div>

  </div>
</div>
<div id="rotateSign">
  Drehe dein Gerät auf die Seite
</div>
  <script type="module" src="script.js"></script>
</body>
</html>
